<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --line:#2C2C2E; --line2:#3A3A3C;
  --text:#fff; --muted:#8E8E93; --dim:#636366;
  --accent:#BF5AF2; --accent-ink:#000; --gold:#FF9F0A; --red:#FF453A;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
#app{min-height:100vh;min-height:100dvh}

.screen{padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 104px);display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.screen.full{padding-bottom:calc(var(--sab) + 24px);min-height:100dvh}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:11px}
.card{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-weight:700;letter-spacing:-.01em}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border:0;border-radius:16px;
  background:var(--card2);color:var(--text);font-size:16px;font-weight:500;text-decoration:none;
  transition:transform .1s ease-out,opacity .1s ease-out;touch-action:manipulation}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px;min-height:56px}
.btn.big{min-height:62px;font-size:19px;border-radius:18px}
.btn.ghost{background:transparent;color:var(--accent);min-height:44px}
.btn.tint{background:var(--card);color:var(--accent)}
.btn.danger{background:transparent;color:var(--red);min-height:40px;padding:0;justify-content:flex-start}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px;padding:0 10px;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:999px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text)}
.iconbtn:active{transform:scale(.94)}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:5px 10px;background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:15px;font-weight:600;border-radius:999px;padding:8px 14px;border:0;background:var(--card);color:var(--muted)}
.chip.on{background:#fff;color:#000}
.chip.done{color:var(--accent)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;background:var(--card);border-radius:10px;padding:2px}
.seg button{height:32px;border:0;border-radius:8px;background:transparent;font-size:14px}
.seg button.on{background:#48484A;font-weight:600}

.list{background:var(--card);border-radius:16px;padding:0 14px;display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;padding:8px 0;color:var(--text)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .sub{display:block;font-size:13px;color:var(--muted)}

.target{background:var(--card);border-radius:24px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.bignums{display:flex;align-items:baseline;gap:10px}
.bignums b{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1}
.bignums .x{font-size:38px;color:var(--dim)}
.bar{height:4px;background:var(--card2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:4px;background:var(--accent);transition:width .3s ease}
.clock{font-size:88px;font-weight:200;letter-spacing:-.03em;line-height:1}

.banner{background:rgba(255,159,10,.14);border:1px solid rgba(255,159,10,.35);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.banner b{color:var(--gold);font-size:15px}
.banner span{font-size:13px;color:#EBEBF5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--sab));padding-bottom:var(--sab);
  background:rgba(28,28,30,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
.tabbar button.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;animation:fade .2s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:calc(100dvh - var(--sat) - 40px);overflow-y:auto;z-index:21;
  background:var(--card);border-radius:28px 28px 0 0;padding:10px 18px calc(var(--sab) + 24px);display:flex;flex-direction:column;gap:14px;
  max-width:560px;margin:0 auto;animation:up .32s cubic-bezier(.2,.9,.25,1)}
.sheet .grab{width:40px;height:5px;border-radius:999px;background:#48484A;align-self:center;flex:none}
.sheet .list{background:var(--card2)}
.sheet .li{border-bottom-color:var(--line2)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* wheel pickers */
.wheels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.wheel{display:flex;flex-direction:column;align-items:center;gap:8px}
.wheel select{appearance:none;-webkit-appearance:none;width:100%;height:84px;border:0;border-radius:16px;background:#3A3A3C;
  text-align:center;text-align-last:center;font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;color:#fff;padding:0}
.wheel .iconbtn{width:100%;border-radius:12px;background:var(--card2)}

input.field,select.field{width:100%;height:44px;border:0;border-radius:10px;background:var(--card2);padding:0 12px;font-size:16px;color:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:10px}
.stepper button{width:44px;height:36px;border:0;background:transparent;font-size:20px}
.stepper span{min-width:28px;text-align:center;font-weight:600}

.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translateX(-50%);background:#2C2C2E;color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;z-index:40;animation:fade .2s}

/* transiciones entre pantallas (estilo push/pop de iOS) */
@keyframes pushIn{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes pushOut{from{transform:none;opacity:1}to{transform:translateX(-14%);opacity:0}}
@keyframes popIn{from{transform:translateX(-14%);opacity:0}to{transform:none;opacity:1}}
@keyframes popOut{from{transform:none;opacity:1}to{transform:translateX(30%);opacity:0}}
@keyframes down{from{transform:none}to{transform:translateY(100%)}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.tabbar{view-transition-name:tabbar}
::view-transition-group(tabbar){animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
html[data-nav=push]::view-transition-old(root){animation:pushOut .34s cubic-bezier(.2,.9,.25,1) both}
html[data-nav=push]::view-transition-new(root){animation:pushIn .4s cubic-bezier(.2,.9,.25,1) both}
html[data-nav=pop]::view-transition-old(root){animation:popOut .34s cubic-bezier(.2,.9,.25,1) both}
html[data-nav=pop]::view-transition-new(root){animation:popIn .4s cubic-bezier(.2,.9,.25,1) both}
.anim-push{animation:pushIn .4s cubic-bezier(.2,.9,.25,1) both}
.anim-pop{animation:popIn .4s cubic-bezier(.2,.9,.25,1) both}
.anim-fade{animation:fade .2s ease-out both}
.sheet.closing{animation:down .22s cubic-bezier(.4,0,1,1) forwards}
.scrim.closing{animation:fadeout .22s forwards}
.clock{animation:fade .3s ease-out}

@media (prefers-reduced-motion:reduce){
  .anim-push,.anim-pop{animation:fade .2s both}
  html[data-nav]::view-transition-old(root),html[data-nav]::view-transition-new(root){animation:none}
  .sheet.closing,.scrim.closing{animation:fadeout .15s forwards}
  .sheet,.scrim,.toast{animation:fade .15s}
  .btn,.iconbtn,.bar i{transition:none}
}
@media (prefers-reduced-transparency:reduce){ .tabbar{background:#1C1C1E;backdrop-filter:none;-webkit-backdrop-filter:none} }

</style>
</head>

// ---- Lógica pura (sin DOM): objetivos, escalas de peso, récords, métricas ----
const Logic = (() => {
  const e1rm = (kg, reps) => (kg == null || !reps) ? null : kg * (1 + reps / 30);
  const round1 = x => Math.round(x * 10) / 10;
  const fmtKg = x => x == null ? '—' : (Number.isInteger(x) ? String(x) : String(round1(x)).replace('.', ','));

  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function isoDate(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
  function sessionTime(s) { return s.start || parseDate(s.date).getTime(); }
  function sortedSessions(db) { return [...db.sessions].sort((a, b) => sessionTime(a) - sessionTime(b)); }

  // Todas las apariciones de un ejercicio, de la más antigua a la más reciente
  function history(db, exId) {
    const out = [];
    for (const s of sortedSessions(db)) {
      const e = s.exercises.find(x => x.id === exId);
      if (e && e.sets.length) out.push({ date: s.date, time: sessionTime(s), sets: e.sets, session: s });
    }
    return out;
  }
  function lastSets(db, exId) { const h = history(db, exId); return h.length ? h[h.length - 1].sets : null; }

  function ladder(ex) { return [...new Set(ex.escalas.flat())].sort((a, b) => a - b); }
  function scaleIndex(ex, kg) {
    if (kg == null || !ex.escalas.length) return -1;
    let best = 0, bestD = Infinity;
    ex.escalas.forEach((s, i) => {
      if (s.includes(kg)) { bestD = -1; best = i; return; }
      if (bestD < 0) return;
      const d = Math.min(...s.map(v => Math.abs(v - kg)));
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;

function slug(s) { return s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'ej'; }
function newExercise(cfg, name) {

  return id;
}
function syncActiveWithConfig() {
  const a = db.active; if (!a) return;
  for (const id of db.config.days[a.day]) if (!a.order.includes(id) && exObj(id)) { a.order.push(id); a.ex[id] = { sets: [] }; }
  for (const id of a.order) {
    const want = exObj(id)?.series || a.ex[id].sets.length, sets = a.ex[id].sets;
    while (sets.length < want) sets.push({ target: L.targetFor(db, id, sets.length), done: null });
    while (sets.length > want && !sets[sets.length - 1].done) sets.pop();
  }
  if (!a.ex[a.cur.id]?.sets[a.cur.i]) { const p = pending(); if (p) a.cur = p; }
}

function viewProgreso() {

  const headline = big ? (ui.prog.metric === 'e1' ? `${kg(big.e1)} kg` : ui.prog.metric === 'kg' ? `${kg(big.kg)} kg × ${big.reps}` : `${Math.round(big.vol).toLocaleString('es-CL')} kg`) : '—';
  const trendTxt = tr ? (tr.machineChange ? '<span class="small muted">cambio de máquina este mes</span>' : `<span class="small" style="color:${tr.delta >= 0 ? 'var(--accent)' : 'var(--gold)'}">${tr.delta >= 0 ? '+' : '−'}${kg(Math.abs(tr.delta))} kg vs mes anterior</span>`) : '';
  const trendRows = actives.map(([k, e]) => ({ k, e, t: L.trend(db, k, now) })).filter(x => x.t).sort((x, y) => (y.t.machineChange ? -99 : y.t.delta) - (x.t.machineChange ? -99 : x.t.delta))

  return `<main class="screen">

      ${chart(pts, ui.prog.metric)}
      ${seg('metric', [['e1', 'Fuerza'], ['kg', 'Peso y reps'], ['vol', 'Volumen']])}

      <div class="stat"><span class="xs muted">Mejor fuerza</span><b style="color:var(--gold)">${kg(rec.bestE.e)} kg</b><span class="xs muted">${kg(rec.bestE.kg)} × ${rec.bestE.reps} · ${esc(fmtDate(rec.bestE.date))}</span></div>
      <div class="stat"><span class="xs muted">Reps con ${kg(rec.repsAt.kg)} kg</span><b>${rec.repsAt.reps}</b><span class="xs muted">${esc(fmtDate(rec.repsAt.date))}</span></div></div>` : ''}
    ${trendRows ? `<div><p class="eyebrow" style="margin-bottom:8px">Último mes, todos los ejercicios</p><div class="list">${trendRows}</div></div>` : ''}
  </main>${tabbar()}`;
}
function chart(pts, metric) {
  const W = 340, H = 170, pl = 4, pr = 34, pt = 12, pb = 22;
  const valid = pts.filter(p => (metric === 'vol' ? p.vol : metric === 'kg' ? p.kg : p.e1) != null && (metric !== 'vol' || p.vol > 0));
  if (valid.length < 2) return `<div class="muted small" style="padding:40px 0;text-align:center">Aún no hay suficientes datos en este rango.</div>`;
  const v = p => metric === 'vol' ? p.vol : metric === 'kg' ? p.kg : p.e1;
  const t0 = valid[0].time, t1 = valid[valid.length - 1].time;
  const X = t => pl + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (W - pl - pr);
  const scaleY = (vals) => { let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad; return { lo, hi, Y: x => pt + (1 - (x - lo) / (hi - lo)) * (H - pt - pb) }; };
  const s = scaleY(valid.map(v));
  const line = (pp, f, Y, color, w) => `<polyline fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" points="${pp.map(p => `${X(p.time).toFixed(1)},${Y(f(p)).toFixed(1)}`).join(' ')}"/>`;
  let svg = '';
  const ticks = [s.lo + (s.hi - s.lo) * 0.15, (s.lo + s.hi) / 2, s.hi - (s.hi - s.lo) * 0.15];
  for (const tv of ticks) svg += `<line x1="${pl}" x2="${W - pr}" y1="${s.Y(tv).toFixed(1)}" y2="${s.Y(tv).toFixed(1)}" stroke="#2C2C2E"/><text x="${W - pr + 4}" y="${(s.Y(tv) + 4).toFixed(1)}" fill="#8E8E93" font-size="11">${metric === 'vol' ? Math.round(tv / 100) / 10 + 'k' : Math.round(tv)}</text>`;
  for (let k = 1; k < valid.length; k++) if (valid[k].scale !== valid[k - 1].scale && valid[k].scale >= 0 && valid[k - 1].scale >= 0) {
    const x = X(valid[k].time).toFixed(1); svg += `<line x1="${x}" x2="${x}" y1="${pt}" y2="${H - pb}" stroke="#8E8E93" stroke-dasharray="3 4"/>`;
  }
  if (metric === 'kg') {
    const r = scaleY(valid.map(p => p.reps));
    svg += line(valid, p => p.reps, r.Y, '#636366', 2);
  }
  svg += line(valid, v, s.Y, '#BF5AF2', 2.5);
  let best = valid[0]; valid.forEach(p => { if (v(p) > v(best)) best = p; });
  const lp = valid[valid.length - 1];
  svg += `<circle cx="${X(best.time).toFixed(1)}" cy="${s.Y(v(best)).toFixed(1)}" r="4.5" fill="#FF9F0A"/>`;
  svg += `<circle cx="${X(lp.time).toFixed(1)}" cy="${s.Y(v(lp)).toFixed(1)}" r="5" fill="#BF5AF2" stroke="#1C1C1E" stroke-width="2"/>`;
  // etiquetas de meses
  const months = []; const d = new Date(t0); d.setDate(1); d.setHours(0, 0, 0, 0); d.setMonth(d.getMonth() + 1);
  while (d.getTime() <= t1) { months.push(d.getTime()); d.setMonth(d.getMonth() + 1); }
  const every = Math.ceil(months.length / 6);
  months.forEach((m, k) => { if (k % every === 0) svg += `<text x="${X(m).toFixed(1)}" y="${H - 6}" fill="#8E8E93" font-size="11" text-anchor="middle">${new Date(m).toLocaleDateString('es-CL', { month: 'short' }).replace('.', '')}</text>`; });
  const legend = metric === 'kg' ? `<div class="row xs muted" style="justify-content:flex-start;gap:14px"><span><span style="color:#BF5AF2">━</span> peso</span><span><span style="color:#8E8E93">━</span> reps</span><span>┊ cambio de máquina</span></div>` : `<div class="xs muted">● naranjo: mejor marca · ┊ cambio de máquina</div>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de progreso">${svg}</svg>${legend}`;
}

    const n = s.exercises.reduce((a, e) => a + e.sets.length, 0);
    const open = ui.histOpen === s.id;
    return `<button type="button" class="li" data-act="hOpen" data-id="${esc(s.id)}"><span class="grow">${esc(fmtDate(s.date, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }))} · Día ${esc(s.day)}<span class="sub">${s.exercises.length} ejercicios · ${n} series${s.end ? ' · ' + durWords(s.end - s.start) : ''}${s.records ? ` · <span style="color:var(--gold)">${s.records} récords</span>` : ''}</span></span>${icon.chev}</button>
      ${open ? `<div style="padding:4px 0 12px;display:flex;flex-direction:column;gap:6px">${s.exercises.map(e => `<div class="row small"><span>${esc(exName(e.id))}</span><span class="muted num">${e.sets.map(setTxt).join(' · ')}</span></div>`).join('')}
        <button type="button" class="btn danger" data-act="hDel" data-id="${esc(s.id)}">Borrar esta sesión</button></div>` : ''}`;
  }).join('');
  return `<main class="screen"><h1>Historial</h1>
    <section class="card" style="gap:10px"><b>Respaldo</b><span class="small muted">Tus datos viven en este iPhone. Exporta un respaldo de vez en cuando.</span>
      <div class="grid2"><button type="button" class="btn sm" data-act="expJson">Respaldo</button><button type="button" class="btn sm" data-act="expCsv">Exportar a Excel</button></div>
      <label class="btn sm tint" style="cursor:pointer">Restaurar respaldo<input type="file" accept="application/json,.json" data-ch="import" style="display:none"></label></section>
    <div class="list">${rows}</div>
    ${!ui.histMore && ss.length > 40 ? `<button type="button" class="btn" data-act="hMore">Ver las ${ss.length} sesiones</button>` : ''}
  </main>${tabbar()}`;
}
function download(name, text, type) {
  const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportCsv() {
  const rows = [['fecha', 'dia', 'ejercicio', 'serie', 'kg', 'reps', 'fuerza_estimada', 'tiempo_previo_seg']];
  for (const s of L.sortedSessions(db)) for (const e of s.exercises) e.sets.forEach((x, i) => rows.push([s.date, s.day, exName(e.id), i + 1, x.kg ?? '', x.reps, x.kg != null ? L.round1(L.e1rm(x.kg, x.reps)) : '', x.gap != null ? Math.round(x.gap / 1000) : '']));
  const csv = '﻿' + rows.map(r => r.map(c => { c = String(c).replace('.', ','); return /[;"\n]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c; }).join(';')).join('\n');
  download(`gym-${L.isoDate(new Date())}.csv`, csv, 'text/csv');
}

// ---------- render y eventos ----------
let lastKey = null;
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function screenKey() {
  if (ui.view === 'rutina' || ui.view === 'resumen') return ui.view;
  if (ui.tab === 'entrenar' && db.active && (ui.view === 'serie' || ui.view === 'entre')) return ui.view + ':' + (db.active.cur.id) + ':' + db.active.cur.i;
  return ui.tab;
}
function render() {
  let html;
  if (ui.view === 'rutina') html = viewRutina();
  else if (ui.view === 'resumen') html = viewResumen();
  else if (ui.tab === 'entrenar' && db.active && ui.view === 'serie') html = viewSerie();
  else if (ui.tab === 'entrenar' && db.active && ui.view === 'entre') html = viewEntre();
  else if (ui.tab === 'progreso') html = viewProgreso();
  else if (ui.tab === 'historial') html = viewHistorial();
  else html = viewInicio();
  const key = screenKey();
  const nav = lastKey !== null && key !== lastKey ? (ui.nav || 'fade') : null;
  ui.nav = null; lastKey = key;
  const full = html + renderSheet() + (ui.confirm ? `<div class="scrim" data-act="cNo"></div><div class="sheet" role="alertdialog" aria-modal="true" style="z-index:30"><div class="grab"></div><p style="margin:4px 0;font-size:17px;text-align:center">${esc(ui.confirm.text)}</p><button type="button" class="btn primary" data-act="cOk">${esc(ui.confirm.ok)}</button><button type="button" class="btn" data-act="cNo">Cancelar</button></div>` : '');
  const vt = nav && document.startViewTransition && !reduceMotion();
  const apply = () => {
    $app.innerHTML = full;
    if (nav) { if (nav !== 'fade') window.scrollTo(0, 0); if (!vt) $app.firstElementChild?.classList.add('anim-' + nav); }
  };
  if (vt) {
    document.documentElement.dataset.nav = nav;
    const t = document.startViewTransition(apply);
    t.finished.finally(() => { delete document.documentElement.dataset.nav; });
  } else apply();
}
// Cierra la hoja inferior con animación y luego ejecuta el cambio
function closeSheetThen(fn) {
  const sh = $app.querySelectorAll('.sheet,.scrim');
  if (!sh.length) { fn(); render(); return; }
  sh.forEach(el => el.classList.add('closing'));
  setTimeout(() => { fn(); render(); }, 200);
}
setInterval(() => { document.querySelectorAll('[data-since]').forEach(el => { el.textContent = dur(Date.now() - +el.dataset.since); }); }, 1000);

const act = {
  tab: d => { ui.tab = d.t; if (d.t === 'entrenar' && db.active) ui.view = ui.view === 'entre' ? 'entre' : 'serie'; else if (ui.view !== 'rutina') ui.view = null; window.scrollTo(0, 0); },
  home: () => { ui.nav = 'pop'; ui.view = null; ui.tab = 'entrenar'; ui.sheet = null; },
  resume: () => { ui.nav = 'push'; ui.view = 'serie'; },
  start: d => { if (db.active) return; ui.dayOverride = null; startSession(d.day); return false; },
  switchDay: d => { ui.dayOverride = d.day; },
  cumpli: () => { const a = db.active, t = a.ex[a.cur.id].sets[a.cur.i].target; saveSet(t.kg, t.reps); return false; },
  sheet: d => { ui.sheet = d.s; },
  closeSheet: () => { closeSheetThen(() => { ui.sheet = null; }); return false; },
  pickSet: d => { ui.nav = +d.i > db.active.cur.i ? 'push' : 'pop'; db.active.cur.i = +d.i; save(); },
  pickEx: d => { ui.nav = 'push'; const a = db.active, i = a.ex[d.id].sets.findIndex(s => !s.done); a.cur = { id: d.id, i: i >= 0 ? i : 0 }; ui.sheet = null; ui.view = 'serie'; save(); },
  goSerie: () => { ui.nav = 'push'; ui.view = 'serie'; },
  wheel: d => { const s = document.getElementById('w-' + d.w); if (!s) return false; const n = s.selectedIndex + (+d.d); const max = s.options.length - 1; if (n >= 0 && n <= max) s.selectedIndex = n; return false; },
  saveEdit: () => { const k = document.getElementById('w-kg'), r = document.getElementById('w-reps'), o = document.getElementById('w-kg-other'); const ov = o && o.value ? parseFloat(o.value.replace(',', '.')) : NaN; saveSet(!isNaN(ov) ? ov : (k ? parseFloat(k.value) : null), parseInt(r.value, 10)); return false; },
  finish: () => { if (pending()) ask('Quedan series sin hacer. ¿Terminar el día igual?', 'Terminar', finishSession); else finishSession(); return false; },
  cOk: () => { const f = ui.confirm.fn; ui.confirm = null; f(); return false; },
  cNo: () => { closeSheetThen(() => { ui.confirm = null; }); return false; },
  addToday: d => { ui.nav = 'push'; const a = db.active; a.order.push(d.id); a.ex[d.id] = { sets: Array.from({ length: exObj(d.id).series || 1 }, (_, i) => ({ target: L.targetFor(db, d.id, i), done: null })) }; a.cur = { id: d.id, i: 0 }; ui.sheet = null; ui.view = 'serie'; save(); },
  addTodayNew: () => { const v = document.getElementById('newExName').value.trim(); if (!v) return false; const id = newExercise(db.config, v); act.addToday({ id }); },
  openRutina: d => { ui.sheet = null; openRutina(d.day); return false; },
  rDay: d => { ui.rutina.day = d.day; ui.rutina.open = null; },
  rOpen: d => { ui.rutina.open = d.id || null; },
  series: d => { const e = ui.rutina.draft.exercises[d.id]; e.series = Math.max(1, Math.min(10, e.series + (+d.d))); },
  mv: d => { const l = ui.rutina.draft.days[ui.rutina.day], k = +d.k, j = k + (+d.d); if (j < 0 || j >= l.length) return false; [l[k], l[j]] = [l[j], l[k]]; },
  rmEx: d => { ui.rutina.draft.days[ui.rutina.day].splice(+d.k, 1); ui.rutina.open = null; },
  rAddNew: () => { const v = document.getElementById('rNew').value.trim(); if (!v) return false; const id = newExercise(ui.rutina.draft, v); ui.rutina.draft.days[ui.rutina.day].push(id); ui.rutina.open = id; },
  rCancel: () => { ui.nav = 'pop'; ui.view = ui.rutina.back === 'rutina' ? null : ui.rutina.back; ui.rutina = null; },
  rSave: () => { ui.nav = 'pop'; db.config = ui.rutina.draft; syncActiveWithConfig(); save(); ui.view = ui.rutina.back; ui.rutina = null; toast('Rutina guardada'); },
  prog: d => { ui.prog[d.k] = d.v; },
  progPick: d => { ui.prog.ex = d.id; window.scrollTo({ top: 0, behavior: 'smooth' }); },
  hOpen: d => { ui.histOpen = ui.histOpen === d.id ? null : d.id; },
  hMore: () => { ui.histMore = true; },
  hDel: d => { ask('¿Borrar esta sesión del historial?', 'Borrar', () => { db.sessions = db.sessions.filter(s => s.id !== d.id); save(); render(); }); return false; },
  expJson: () => { download(`gym-respaldo-${L.isoDate(new Date())}.json`, JSON.stringify(db), 'application/json'); return false; },
  expCsv: () => { exportCsv(); return false; },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = act[el.dataset.act]; if (!fn) return;
  ev.preventDefault();
  if (fn(el.dataset) !== false) render();
});
const ch = {
  name: (el) => { ui.rutina.draft.exercises[el.dataset.id].name = el.value.trim() || ui.rutina.draft.exercises[el.dataset.id].name; },
  equipo: el => { ui.rutina.draft.exercises[el.dataset.id].equipo = el.value.trim(); },
  musculo: el => { ui.rutina.draft.exercises[el.dataset.id].musculo = el.value; },
  lo: el => { const e = ui.rutina.draft.exercises[el.dataset.id], v = parseInt(el.value, 10); if (v > 0) e.rango = [v, Math.max(v, e.rango[1])]; },
  hi: el => { const e = ui.rutina.draft.exercises[el.dataset.id], v = parseInt(el.value, 10); if (v > 0) e.rango = [Math.min(e.rango[0], v), v]; },
  escalas: el => { ui.rutina.draft.exercises[el.dataset.id].escalas = el.value.split('|').map(s => s.split(/[,;\s]+/).map(x => parseFloat(x.replace(',', '.'))).filter(x => !isNaN(x)).sort((a, b) => a - b)).filter(s => s.length); },
  addExisting: el => { if (!el.value) return; ui.rutina.draft.days[ui.rutina.day].push(el.value); render(); },
  progEx: el => { ui.prog.ex = el.value; render(); },
  import: el => {
    const f = el.files[0]; if (!f) return;
    f.text().then(t => { const d = JSON.parse(t); if (!d.config || !d.sessions) throw 0; ask('Esto reemplaza todos los datos actuales por los del respaldo. ¿Seguir?', 'Restaurar', () => { db = d; if (!('active' in db)) db.active = null; save(); render(); toast('Respaldo restaurado'); }); }).catch(() => toast('Ese archivo no es un respaldo válido'));
  },
};
document.addEventListener('change', ev => { const el = ev.target.closest('[data-ch]'); if (el && ch[el.dataset.ch]) ch[el.dataset.ch](el); });
if (db.active) ui.view = 'serie';
render();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai') && !location.hostname.includes('claudeusercontent')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
